services:
  - type: web
    name: opportunityshield-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /v3/api-docs
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
